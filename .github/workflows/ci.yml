# Builds and tests HuskHomes, then uploads the generated JAR files as GitHub Actions artifacts.
name: Build & Upload

on:
  push:
    branches: [ 'master' ]
    paths-ignore:
      - 'docs/**'
      - 'workflows/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout for CI 🛎️'
        uses: actions/checkout@v6
      - name: 'Set up JDK 25 📦'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: 'Build with Gradle 🏗️'
        uses: gradle/gradle-build-action@v3
        with:
          arguments: build test
      - name: 'Upload build artifacts 📦'
        uses: actions/upload-artifact@v4
        with:
          name: HuskHomes-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
